[tools]
deno = "latest"
go = "latest"
node = "lts"
ruby = "latest"
terraform = "latest"

ecspresso = "latest"
peco = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }

"github:knqyf263/pet" = "latest"
"github:busser/tfautomv" = "latest"
"github:mattn/cho" = "0.0.17"
"github:lusingander/stu" = "latest"
"github:googleworkspace/cli" = "latest"

dyff = "latest"

direnv = "latest"
"aqua:neovim/neovim" = "latest"  # デフォルトだと vfox が選ばれるため aqua を明示
ripgrep = "latest"
fd = "latest"
jq = "latest"
gh = "latest"

docker-cli = "latest"
"aqua:docker/buildx" = "latest"  # docker CLIプラグイン。registry未収載のためaqua明示。setup-mac.shで ~/.docker/cli-plugins/ に symlink する

[settings]
idiomatic_version_file_enable_tools = ["node", "ruby", "terraform"]
experimental = true # 主にrubyのPrecompiled Binariesのために有効化
